version: '3.8'

services:
  demo-app:
    build:
      context: ./demo_app
      dockerfile: Dockerfile
    container_name: nikspider-demo-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FIXED=0
      - NIKSPIDER_TOKEN=${NIKSPIDER_TOKEN:-nikspider-verify=demo_token_12345678}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/').read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: nikspider-juice-shop
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nikspider-backend
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=1
      - NIKSPIDER_TOKEN=${NIKSPIDER_TOKEN:-nikspider-verify=demo_token_12345678}
      - LLM_PROVIDER=${LLM_PROVIDER:-meta}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.meta.ai/v1}
      - LLM_API_KEY=${LLM_API_KEY:-mock}
      - LLM_MODEL=${LLM_MODEL:-muse-spark-1.3}
      - LLM_MODEL_HEAVY=${LLM_MODEL_HEAVY:-muse-wonder-1.0}
    depends_on:
      demo-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs').read()\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./nikspider/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_DEMO_TARGET_URL: ${VITE_DEMO_TARGET_URL:-http://demo-app:5000}
    container_name: nikspider-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_MOCK=${VITE_MOCK:-0}
      - VITE_DEMO_TARGET_URL=${VITE_DEMO_TARGET_URL:-http://demo-app:5000}
    depends_on:
      backend:
        condition: service_healthy

